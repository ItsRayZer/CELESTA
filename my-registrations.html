<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>My Registrations — SPARK 2K26</title>
<meta name="description" content="See all your SPARK 2K26 registrations and whether each one is paid. Registrations are saved on this device when you open your ticket.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">
<link rel="stylesheet" href="/styles.css?v=66">
<link rel="stylesheet" href="/theme-purple.css?v=12">
<noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
<style>
  html{background:#060608}body{background:#060608}
  .mr-page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 120px}
  .mr-top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .mr-top a{color:rgba(255,255,255,.75);text-decoration:none;font-size:14px}
  .mr-top b{color:#fff;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
  .mr-box{width:100%;max-width:560px}
  .mr-box h1{color:#fff;font-family:Georgia,serif;font-size:32px;font-weight:700;margin:4px 0 8px}
  .mr-box .mr-sub{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6;margin:0 0 20px}
  .mr-sec{width:100%;max-width:560px;margin-top:8px}
  .mr-sec h2{color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}
  .mr-card{background:linear-gradient(135deg,rgba(123,61,255,.16),rgba(143,71,230,.08));border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;margin-bottom:12px}
  .mr-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .mr-ev{color:#fff;font-family:Georgia,serif;font-size:22px;font-weight:700;margin:0}
  .mr-id{color:rgba(255,255,255,.55);font-family:monospace;font-size:12px;margin:4px 0 0;word-break:break-all}
  .mr-badge{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
  .mr-badge.paid{background:rgba(34,197,94,.16);color:#4ade80;border:1px solid rgba(74,222,128,.4)}
  .mr-badge.unpaid{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
  .mr-rows{margin:0}
  .mr-rows div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09);font-size:14px;line-height:1.45}
  .mr-rows div:last-child{border-bottom:0}
  .mr-rows dt{color:rgba(255,255,255,.65);flex:none}
  .mr-rows dd{margin:0;color:#fff;font-weight:600;text-align:right;word-break:break-word}
  .mr-rows dd small{display:block;font-weight:400;color:rgba(255,255,255,.7)}
  .mr-ticket{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:14px;background:#fff;color:#5b21b6;font-size:16px;font-weight:800;text-decoration:none;border-radius:99px}
  .mr-ticket:active{transform:scale(.98)}
  .mr-events{display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:12px;background:rgba(255,255,255,.07);color:#fff;font-size:16px;font-weight:700;text-decoration:none;border-radius:99px;border:1px solid rgba(255,255,255,.35)}
  .mr-events:active{transform:scale(.98)}
  .mr-empty{color:rgba(255,255,255,.65);font-size:15px;line-height:1.6;margin:0 0 12px}
  .mr-empty a{color:#fff}
  .mr-cta{display:block;width:100%;text-align:center;background:linear-gradient(135deg,#7b3dff,#8f47e6);border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;text-decoration:none;margin:4px 0 14px;font-family:inherit}
  .mr-note{color:rgba(255,255,255,.55);font-size:13px;line-height:1.5;margin:0}
  .mr-loading{color:rgba(255,255,255,.6);font-size:14px;padding:12px 0}
</style>
</head>
<body class="dark-page">
<div class="mr-page">
  <div class="mr-top">
    <a href="/events">&larr; Events</a>
    <b>SPARK 2K26</b>
  </div>
  <div class="mr-box">
    <h1>My Registrations</h1>
    <p class="mr-sub">Your registrations are saved on this device when you open your ticket. On another phone, open your ticket link and it will appear here too.</p>
  </div>
  <div class="mr-sec" id="mr-saved">
    <h2>Saved on this device</h2>
    <div id="mr-saved-list"></div>
  </div>
</div>
<script src="/app.js?v=35" defer></script>
<script src="/assets/spark-bot.js?v=27"></script>
<script>
(function(){
  var REGS_KEY='spark_my_regs';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // Member names, whether stored as plain strings (old form / admin edits) or as objects {name, phone, email} (new form).
  function memNames(list){return (list||[]).map(function(m){return typeof m==='string'?m:((m&&m.name)||'');}).filter(Boolean);}
  function loadIds(){
    try{var a=JSON.parse(localStorage.getItem(REGS_KEY)||'[]');return Array.isArray(a)?a:[];}
    catch(e){return [];}
  }
  function saveIds(ids){
    try{localStorage.setItem(REGS_KEY,JSON.stringify(ids.slice(0,20)));}catch(e){}
    refreshBadge();
  }
  function refreshBadge(){
    var b=document.querySelector('.myregs-count');
    if(!b)return;
    var n=loadIds().length;
    b.textContent=n>99?'99+':String(n);
    b.hidden=n===0;
  }
  function cardHTML(t){
    var memberList=[t.name].concat(memNames(t.members));
    var badge=t.paid
      ?'<span class="mr-badge paid">Paid</span>'
      :'<span class="mr-badge unpaid">Not Paid — pay at the venue</span>';
    return '<article class="mr-card">'
      +'<div class="mr-card-top"><div><p class="mr-ev">'+esc(t.event)+'</p>'
      +'<p class="mr-id">'+esc(t.id)+'</p></div>'+badge+'</div>'
      +'<dl class="mr-rows">'
      +'<div><dt>Leader</dt><dd>'+esc(t.name)+'</dd></div>'
      +'<div><dt>School</dt><dd>'+esc(t.school)+'</dd></div>'
      +'<div><dt>Members</dt><dd>'+memberList.map(function(m){return esc(m);}).join(', ')+'<small>Team of '+esc(t.team)+'</small></dd></div>'
      +(t.teamName?'<div><dt>Team</dt><dd>'+esc(t.teamName)+'</dd></div>':'')
      +(t.fee?'<div><dt>Fee</dt><dd>'+esc(t.fee)+'</dd></div>':'')
      +'<div><dt>Date</dt><dd>Fri, 27 Nov 2026 · 10 AM</dd></div>'
      +'</dl>'
      +'<a class="mr-ticket" href="/ticket?id='+encodeURIComponent(t.id)+'">View ticket</a>'
      +'</article>';
  }
  function fetchTicket(id){
    // 10s timeout: a hung fetch must fail visibly, not hang renderSaved.
    var ctl=('AbortController' in window)?new AbortController():null;
    var to=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},10000):null;
    function done(v){if(to)clearTimeout(to);return v;}
    return fetch('/api/ticket?id='+encodeURIComponent(id),{signal:ctl?ctl.signal:undefined})
      .then(function(r){
        if(r.status===404)return done({gone:true});
        if(!r.ok)return done({failed:true});
        return r.json();
      })
      .then(function(d){
        if(d&&d.gone)return done({gone:true});
        if(d&&d.failed)return done({failed:true});
        return done((d&&d.ok&&d.ticket)?d.ticket:{failed:true});
      }).catch(function(){return done({failed:true});});
  }
  function emptyHTML(){
    return '<p class="mr-empty">No registrations here yet.</p>'
      +'<a class="mr-cta" href="/events">Register Now</a>'
      +'<p class="mr-note">Or open your ticket link on this phone and it will appear here.</p>';
  }
  var savedList=document.getElementById('mr-saved-list');
  function renderSaved(){
    var ids=loadIds();
    if(!ids.length){
      savedList.innerHTML=emptyHTML();
      return;
    }
    savedList.innerHTML='<p class="mr-loading">Loading your saved registrations…</p>';
    Promise.all(ids.map(fetchTicket)).then(function(ts){
      var found=[], failed=[], gone={};
      ts.forEach(function(t,i){
        if(!t)return;
        if(t.gone)gone[ids[i]]=true;
        else if(t.failed)failed.push(ids[i]);
        else found.push(t);
      });
      // Prune ONLY confirmed-gone ids. A transient failure (429/500/
      // network/timeout) must never wipe a saved ticket.
      if(Object.keys(gone).length){
        saveIds(ids.filter(function(id){return !gone[id];}));
      }
      if(!found.length&&!failed.length){
        savedList.innerHTML=emptyHTML();
        return;
      }
      var html=found.map(cardHTML).join('');
      if(failed.length){
        html+='<p class="mr-empty">Couldn\u2019t load '+failed.length+' saved registration'+(failed.length>1?'s':'')+' \u2014 check connection and refresh.</p>';
      }
      html+='<a class="mr-events" href="/events">See all events</a>';
      savedList.innerHTML=html;
    });
  }
  renderSaved();
})();
</script>
</body>
</html>
