<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Your Ticket — SPARK 2K26</title>
<meta name="description" content="Your SPARK 2K26 registration ticket. Show it at the registration desk on 27 November 2026.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Marcellus&display=swap">

<noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
<style>
  html{background:#060608;overflow-x:hidden;overflow-x:clip}body{background:#060608;overflow-x:hidden;overflow-x:clip}
  /* Page is a plain block column (NOT flex): every child is width:100% +
     max-width:520px + margin auto, so nothing can be forced wider than the
     screen by flex-item min-content. The earlier overflow was #tk-slot —
     the unstyled wrapper around the card. It was the only flex item with
     no width and no min-width:0, so the card's content sized it to 520px
     and it overflowed the phone on both sides. It now has the same
     width/max-width/min-width as every other row. */
  .tk-page{min-height:100svh;padding:20px 16px 48px;overflow-x:clip}
  .tk-page .tk-top{width:100%;max-width:520px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}
  .tk-page .tk-top a{color:rgba(255,255,255,.75);text-decoration:none;font-size:14px}
  .tk-page .tk-top b{color:#fff;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
  .tk-page .tk-state{width:100%;max-width:520px;margin:0 auto;color:rgba(255,255,255,.8);text-align:center;padding:60px 0;line-height:1.6}
  .tk-page .tk-state h1{color:#fff;font-size:24px;margin-bottom:8px}
  .tk-page .tk-state p{font-size:15px}
  .tk-page #tk-slot{width:100%;max-width:520px;min-width:0;margin:0 auto}
  .tk-page .tk-live{width:100%;max-width:520px;margin:14px auto 0;text-align:center;font-size:12px;color:rgba(255,255,255,.55)}
  .tk-page .tk-actions{width:100%;max-width:520px;margin:16px auto 0;display:flex;flex-direction:row;gap:10px}
  .tk-page .tk-actions .tk-dl{flex:1;min-width:0}
  .tk-page .tk-actions .tk-share{flex:1;min-width:0}
  .tk-page .tk-dl-note{width:100%;max-width:520px;margin:12px auto 0;text-align:center;font-size:12px;color:rgba(255,255,255,.55);line-height:1.6}

  /* ===== Unified ticket / receipt card (Fees-receipt layout, SPARK purple) ===== */
  .rc-card{width:100%;max-width:520px;min-width:0;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:#1a0b2e}
  .rc-marquee{background:#d6ff3f;color:#000;overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:900;font-size:13px;letter-spacing:.18em;line-height:1}
  .rc-marquee .rc-mq-track{display:inline-block;white-space:nowrap;animation:rcmq 16s linear infinite}
  .rc-marquee .rc-mq-track span{padding-right:12px}
  @keyframes rcmq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .rc-body{position:relative;overflow:hidden;background:radial-gradient(120% 70% at 85% -10%,rgba(123,61,255,.65) 0%,rgba(123,61,255,0) 60%),radial-gradient(100% 70% at 0% 30%,rgba(143,71,230,.55) 0%,rgba(143,71,230,0) 60%),radial-gradient(90% 60% at 60% 110%,rgba(61,21,150,.55) 0%,rgba(61,21,150,0) 60%),#1a0b2e}
  .rc-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  .rc-wm b{font-size:132px;font-weight:900;letter-spacing:.02em;color:rgba(255,255,255,.05);white-space:nowrap;transform:rotate(-8deg)}
  .rc-inner{position:relative;padding:20px 20px 18px}
  .rc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .rc-kicker{font-size:10px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.7);text-transform:uppercase}
  .rc-name{font-size:22px;font-weight:900;line-height:1.15;margin-top:6px}
  .rc-sub{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}
  .rc-pill{flex-shrink:0;font-size:11px;font-weight:900;letter-spacing:.08em;padding:7px 12px;border-radius:999px;border:2px solid}
  .rc-pill.paid{color:#22c55e;border-color:#22c55e;background:rgba(34,197,94,.12)}
  .rc-pill.unpaid{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.10)}
  .rc-pill.void{color:#ef4444;border-color:#ef4444;background:rgba(239,68,68,.12)}
  .rc-amt-label{font-size:10px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:18px}
  .rc-amt{font-size:52px;font-weight:900;line-height:1.05;letter-spacing:-.01em;margin-top:2px}
  .rc-amt small{font-size:22px;font-weight:800;color:rgba(255,255,255,.75)}
  .rc-who{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
  .rc-who>div{min-width:0}
  .rc-who .rc-who-label{font-size:10px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.6);text-transform:uppercase}
  .rc-who .rc-who-name{font-size:19px;font-weight:900;margin-top:3px;overflow-wrap:break-word}
  .rc-who .rc-who-date{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
  .rc-chest-pill{flex-shrink:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:rgba(0,0,0,.25);white-space:nowrap}
  .rc-details{margin-top:16px;border-radius:16px;padding:14px 16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);font-size:14px;min-width:0}
  .rc-details .rc-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;min-width:0}
  .rc-details .rc-row span{color:rgba(255,255,255,.6);flex-shrink:0}
  .rc-details .rc-row b{text-align:right;font-weight:700;min-width:0;overflow-wrap:break-word}
  .rc-white{background:#fff;color:#111;padding:18px 20px 20px}
  .rc-split{display:flex;gap:16px}
  .rc-split .rc-cell{flex:1}
  .rc-split .rc-cell-label{font-size:10px;font-weight:800;letter-spacing:.18em;color:#666;text-transform:uppercase}
  .rc-split .rc-cell-val{font-size:24px;font-weight:900;margin-top:2px}
  .rc-verify{margin-top:14px}
  .rc-verify .rc-cell-label{font-size:10px;font-weight:800;letter-spacing:.18em;color:#666;text-transform:uppercase}
  .rc-verify .rc-cell-val{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;color:#5b21b6;margin-top:2px;letter-spacing:.04em}
  .rc-qr-row{display:flex;gap:16px;align-items:flex-start;margin-top:16px}
  .rc-qr{flex-shrink:0;width:120px;height:120px}
  .rc-qr svg{width:100%;height:100%;display:block}
  .rc-qr-side{flex:1;min-width:0;padding-right:2px;overflow-wrap:break-word}
  .rc-qr-side .rc-cell-label{font-size:10px;font-weight:800;letter-spacing:.18em;color:#666;text-transform:uppercase}
  .rc-qr-side .rc-cell-val{font-size:13px;font-weight:700;margin-top:4px;line-height:1.5;word-break:break-word}
  .rc-barcode{margin-top:16px;min-width:0}
  .rc-barcode svg{width:100%;max-width:100%;height:44px;display:block}
  .rc-barcode .rc-bc-code{text-align:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.35em;color:#666;margin-top:6px}
  .rc-proof{text-align:center;font-size:12px;font-weight:800;letter-spacing:.28em;color:#999;margin-top:14px}
  .rc-issuer{text-align:center;font-size:11px;color:#999;margin-top:6px}
  .rc-card img,.rc-card svg{max-width:100%}
  /* Compact on phones: the ticket was too big/tall, so less of it was
     visible at once. Smaller amount, tighter spacing, smaller QR. */
  @media (max-width:480px){
    .tk-page{padding:14px 12px 40px}
    .rc-card{border-radius:22px}
    .rc-inner{padding:16px 16px 14px}
    .rc-name{font-size:20px}
    .rc-amt{font-size:40px}
    .rc-amt small{font-size:18px}
    .rc-who-name{font-size:17px}
    .rc-wm b{font-size:96px}
    .rc-details{padding:12px 14px;font-size:13px}
    .rc-white{padding:14px 16px 16px}
    .rc-split .rc-cell-val{font-size:20px}
    .rc-verify .rc-cell-val{font-size:17px}
    .rc-qr{width:96px;height:96px}
    .rc-qr-row{gap:12px}
    .rc-barcode svg{height:32px}
    .rc-barcode .rc-bc-code{font-size:10px}
    .rc-proof{letter-spacing:.2em}
  }
</style>
</head>
<body class="dark-page">
<div class="tk-page">
  <div class="tk-top">
    <a href="/events">&larr; Events</a>
    <b>SPARK 2K26</b>
  </div>
  <div class="tk-state" id="tk-state"><p>Loading your ticket…</p></div>
  <div id="tk-slot"></div>
  <p class="tk-live" id="tk-live" hidden>Waiting for payment… this page updates itself when the counter marks you paid.</p>
</div>
<script src="/app.js?v=35" defer></script>
<script src="/assets/qrcode.min.js?v=1" defer></script>
<script src="/assets/html2canvas.min.js?v=1" defer></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function svgEsc(s){return esc(s);}
  // Member names, whether stored as plain strings (old form / admin
  // edits) or as objects {name, phone, email} (new form).
  function memNames(list){return (list||[]).map(function(m){return typeof m==='string'?m:((m&&m.name)||'');}).filter(Boolean);}
  // Update only the button's label span, never textContent on the button
  // itself: that would wipe the inline SVG icon (V2-m14).
  function setBtnLabel(btn,txt){var l=btn?btn.querySelector('.tk-btn-label'):null;if(l){l.textContent=txt;}else if(btn){btn.textContent=txt;}}
  function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
  // Spark dot QR: a real QR code drawn as dots, finder squares kept solid so
  // it still scans. Returns SVG shape elements at (x0,y0) with the size.
  function dotQRshapes(text,x0,y0,size){
    if(typeof qrcode==='undefined'||!text)return '';
    var qr=qrcode(0,'M');
    qr.addData(text);
    qr.make();
    var n=qr.getModuleCount(), q=4, total=n+2*q, cell=size/total, s='';
    function isFinder(r,c){return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);}
    for(var r=0;r<n;r++){
      for(var c=0;c<n;c++){
        if(!qr.isDark(r,c))continue;
        var x=x0+(c+q)*cell, y=y0+(r+q)*cell;
        if(isFinder(r,c)){
          s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cell.toFixed(1)+'" height="'+cell.toFixed(1)+'" fill="#1a0b2e"/>';
        }else{
          s+='<circle cx="'+(x+cell/2).toFixed(1)+'" cy="'+(y+cell/2).toFixed(1)+'" r="'+(cell*0.46).toFixed(1)+'" fill="#1a0b2e"/>';
        }
      }
    }
    return s;
  }
  function dotQRsvg(text,size){
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><rect width="'+size+'" height="'+size+'" rx="16" fill="#fff"/>'+dotQRshapes(text,0,0,size)+'</svg>';
  }
  // Sleek modern barcode from the id: many thin bars (not the chunky old
  // supermarket look). The SVG uses width="100%" as its attribute too, so
  // it has NO fixed 520px intrinsic width — a fixed width attribute gave
  // the card a 520px min-content that forced it wider than a phone screen
  // (flex min-width:auto), which was the mobile overflow bug.
  function barcodeSVG(id){
    var s=String(id||'SPK'), bars='', x=0, W=240, H=40;
    var seed=0;for(var k=0;k<s.length;k++)seed=(seed*31+s.charCodeAt(k))>>>0;
    var n=64;
    for(var i=0;i<n;i++){
      seed=(seed*1103515245+12345)>>>0;
      var w=1+((seed>>16)%3);
      if(((seed>>8)%5)<3){bars+='<rect x="'+x+'" y="0" width="'+w+'" height="'+H+'" fill="#111"/>';}
      x+=w+1;
      if(x>=W)break;
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:40px;display:block">'+bars+'</svg>'
      +'<div class="rc-bc-code">'+esc(s)+'</div>';
  }
  function fmtWhen(iso){
    try{
      var d=new Date(iso); if(isNaN(d))return '—';
      var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var h=d.getHours(), m=('0'+d.getMinutes()).slice(-2), ap=h>=12?'PM':'AM'; h=h%12||12;
      return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+m+' '+ap;
    }catch(e){return '—';}
  }
  // Download = the EXACT card on screen, not a redraw. html2canvas renders
  // the live #reg-ticket element to a PNG, so the download matches the page
  // pixel for pixel (marquee, watermark, QR, barcode, everything). The old
  // SVG rebuild is kept only as a fallback if the library fails to load.
  function downloadTicket(t){
    var btn=document.getElementById('tk-dl');
    var card=document.getElementById('reg-ticket');
    if(!card||typeof html2canvas==='undefined'){downloadTicketSVG(t);return;}
    if(btn){btn.disabled=true;setBtnLabel(btn,'Preparing ticket…');}
    // Freeze the scrolling marquee while capturing so the banner is not
    // caught mid-scroll; restore it right after.
    var track=card.querySelector('.rc-mq-track');
    var prevAnim=track?track.style.animation:'';
    if(track)track.style.animation='none';
    html2canvas(card,{scale:2,backgroundColor:'#1a0b2e',useCORS:true,logging:false}).then(function(canvas){
      if(track)track.style.animation=prevAnim;
      canvas.toBlob(function(b){
        if(!b){downloadTicketSVG(t);if(btn){btn.disabled=false;setBtnLabel(btn,'Download ticket');}return;}
        var a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download='SPARK-2K26-ticket-'+t.id+'.png';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
        if(btn){btn.disabled=false;setBtnLabel(btn,'Download ticket');}
      },'image/png');
    }).catch(function(){if(track)track.style.animation=prevAnim;downloadTicketSVG(t);});
  }
  function downloadTicketSVG(t){
    var btn=document.getElementById('tk-dl');
    if(btn){btn.disabled=true;setBtnLabel(btn,'Preparing ticket…');}
    // Build the download from the ticket DATA, not from the page text, so
    // the image never garbles names. Same new receipt design as the page.
    var memberList=[t.name].concat(memNames(t.members));
    var paid=!!t.paid;
    // A stored custom amount is the amount paid / due (#2).
    var amount=(Number(t.amount||0)>0)?Number(t.amount):(t.feeAmount||0);
    // A paid record with no method shows —, never GPay (#8).
    var method=paid?(t.paidMethod==='cash'?'Cash':(t.paidMethod==='gpay'?'GPay':'—')):'Not paid';
    var W=1080, H=1480, px=72, y=0, svg='';
    svg+='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    svg+='<rect width="'+W+'" height="'+H+'" fill="#1a0b2e"/>';
    // Lime marquee banner.
    svg+='<rect x="0" y="0" width="'+W+'" height="56" fill="#d6ff3f"/>';
    svg+='<text x="'+(W/2)+'" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="900" letter-spacing="4" fill="#000">'+(paid?'FEE RECEIPT  +  FEE RECEIPT  +  FEE RECEIPT':'SPARK TICKET  +  SPARK TICKET  +  SPARK TICKET')+'</text>';
    y=56+48;
    svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="24" letter-spacing="4" fill="rgba(255,255,255,.7)">SPARK 2K26 · '+(paid?'OFFICIAL RECEIPT':'OFFICIAL TICKET')+'</text>';
    svg+='<text x="'+(W-px)+'" y="'+(y+10)+'" text-anchor="end" font-family="Arial,sans-serif" font-size="26" font-weight="900" fill="'+(paid?'#22c55e':'#fbbf24')+'">'+(paid?'PAID IN FULL':'PAY AT VENUE')+'</text>';
    y+=64;
    svg+='<text x="'+px+'" y="'+(y+48)+'" font-family="Arial,sans-serif" font-size="64" font-weight="900" fill="#fff">'+svgEsc(t.event)+'</text>';
    y+=88;
    svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="26" letter-spacing="3" fill="rgba(255,255,255,.65)">'+(paid?'YOU PAID':'FEE DUE')+'</text>';
    y+=52;
    svg+='<text x="'+px+'" y="'+(y+44)+'" font-family="Arial,sans-serif" font-size="96" font-weight="900" fill="#fff">'+svgEsc(inr(amount))+'</text>';
    y+=88;
    svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="26" letter-spacing="3" fill="rgba(255,255,255,.65)">'+(t.teamName?'TEAM':'LEADER')+'</text>';
    y+=44;
    svg+='<text x="'+px+'" y="'+(y+30)+'" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#fff">'+svgEsc(t.teamName||t.name)+'</text>';
    svg+='<text x="'+(W-px)+'" y="'+(y+30)+'" text-anchor="end" font-family="monospace" font-size="32" font-weight="700" fill="#fff">CHEST '+esc(t.chest||'—')+'</text>';
    y+=64;
    var rows=[
      {k:'School',v:t.school},
      {k:'Members',v:memberList.join(', ')+'  ·  Team of '+t.team},
      {k:'Phone',v:t.phone},
      {k:'Method',v:method},
      {k:'Date',v:paid&&t.paidAt?fmtWhen(t.paidAt):'Fri, 27 Nov 2026 · 10 AM'}
    ];
    rows.forEach(function(r){
      svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,.65)">'+svgEsc(r.k)+'</text>';
      svg+='<text x="'+(W-px)+'" y="'+(y+10)+'" text-anchor="end" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">'+svgEsc(r.v)+'</text>';
      y+=52;
    });
    y+=20;
    // White section: verify code + QR.
    var whiteY=y, whiteH=340;
    svg+='<rect x="0" y="'+whiteY+'" width="'+W+'" height="'+whiteH+'" fill="#fff"/>';
    var wy=whiteY+56;
    svg+='<text x="'+px+'" y="'+wy+'" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#666">VERIFY CODE</text>';
    svg+='<text x="'+px+'" y="'+(wy+52)+'" font-family="monospace" font-size="38" font-weight="800" fill="#5b21b6">'+svgEsc(t.id)+'</text>';
    svg+='<text x="'+px+'" y="'+(wy+108)+'" font-family="Arial,sans-serif" font-size="24" fill="#666">Scan at the desk · Show a valid school ID</text>';
    var qrSize=210, qrX=W-px-qrSize, qrY=whiteY+40;
    svg+='<rect x="'+qrX+'" y="'+qrY+'" width="'+qrSize+'" height="'+qrSize+'" rx="16" fill="#fff" stroke="#eee"/>';
    svg+=dotQRshapes('https://spark.maraugusthinosecollege.org/ticket?id='+t.id,qrX,qrY,qrSize);
    y=whiteY+whiteH+36;
    svg+='<text x="'+(W/2)+'" y="'+y+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" letter-spacing="5" fill="rgba(255,255,255,.6)">KEEP THIS. IT’S YOUR PROOF.</text>';
    svg+='<text x="'+(W/2)+'" y="'+(H-28)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="rgba(255,255,255,.5)">NEXUS · SPARK 2K26 · MAR AUGUSTHINOSE COLLEGE</text>';
    svg+='</svg>';
    var img=new Image();
    var url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    img.onload=function(){
      try{
        var c=document.createElement('canvas');c.width=W;c.height=H;
        var cx=c.getContext('2d');cx.drawImage(img,0,0,W,H);
        c.toBlob(function(b){
          if(!b){saveSVG();return;}
          var a=document.createElement('a');
          a.href=URL.createObjectURL(b);
          a.download='SPARK-2K26-ticket-'+t.id+'.png';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
          if(btn){btn.disabled=false;setBtnLabel(btn,'Download ticket');}
        },'image/png');
      }catch(err){saveSVG();}
    };
    img.onerror=function(){saveSVG();};
    function saveSVG(){
      var blob=new Blob([svg],{type:'image/svg+xml'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='SPARK-2K26-ticket-'+t.id+'.svg';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      if(btn){btn.disabled=false;setBtnLabel(btn,'Download ticket');}
    }
    img.src=url;
  }
  var id=new URLSearchParams(location.search).get('id')||'';
  var state=document.getElementById('tk-state');
  var slot=document.getElementById('tk-slot');
  var liveNote=document.getElementById('tk-live');
  var current=null, pollTimer=null;
  // Ticket fetch with a ~10 s timeout so a hung request cannot stall the
  // page (or the poll) forever. Used by the first load and by the poll.
  function ticketFetch(){
    var c=new AbortController();
    var to=setTimeout(function(){c.abort();},10000);
    return fetch('/api/ticket?id='+encodeURIComponent(id),{signal:c.signal}).then(function(r){clearTimeout(to);return r;},function(e){clearTimeout(to);throw e;});
  }
  // Polling has stopped (10 min cap): offer a manual refresh instead.
  function showRefresh(){
    liveNote.hidden=false;
    liveNote.textContent='';
    liveNote.appendChild(document.createTextNode('Still waiting for payment? '));
    var b=document.createElement('button');
    b.type='button'; b.textContent='Tap to refresh';
    b.addEventListener('click',function(){location.reload();});
    liveNote.appendChild(b);
  }
  if(!id){
    state.innerHTML='<h1>Ticket not found</h1><p>This ticket link is missing its ID. Please open the ticket from your registration confirmation.</p>';
    return;
  }
  function render(t){
    current=t;
    // Void state (#40): a cancelled registration shows NO chest, NO QR,
    // NO verify code, NO barcode and NO Download/Share — a void ticket
    // must not be presentable at the desk. The payment poll is stopped
    // and the live note hidden: nothing will ever make it payable again.
    if(t.invalid){
      if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
      liveNote.hidden=true;
      state.style.display='none';
      slot.innerHTML='<div class="rc-card" id="reg-ticket">'
        +'<div class="rc-body"><div class="rc-wm"><b>SPARK</b></div><div class="rc-inner">'
        +'<div class="rc-head"><div><div class="rc-kicker">SPARK 2K26 · OFFICIAL TICKET</div>'
        +'<div class="rc-name">'+esc(t.event)+'</div>'
        +'<div class="rc-sub">Fri, 27 Nov 2026 · 10 AM · Mar Augusthinose College, Ramapuram</div></div>'
        +'<span class="rc-pill void">VOID</span></div>'
        +'<div class="rc-amt-label">Registration cancelled</div>'
        +'<div class="rc-who"><div><div class="rc-who-label">'+(t.teamName?'Team':'Leader')+'</div>'
        +'<div class="rc-who-name">'+esc(t.teamName||t.name)+'</div>'
        +'<div class="rc-who-date">Fri, 27 Nov 2026 · 10 AM</div></div></div>'
        +'<div class="rc-details"><div class="rc-row"><span>School</span><b>'+esc(t.school)+'</b></div></div>'
        +'<p style="margin-top:16px;color:#86868b;line-height:1.6">This registration was cancelled. Contact the desk if you think this is a mistake.</p>'
        +'</div></div></div>';
      document.title=t.event+' — Cancelled | SPARK 2K26';
      return;
    }
    var paid=!!t.paid;
    var memberList=[t.name].concat(memNames(t.members));
    // A stored custom amount is the amount paid / due (#2).
    var amount=(Number(t.amount||0)>0)?Number(t.amount):(t.feeAmount||0);
    // A paid record with no method shows —, never GPay (#8).
    var method=paid?(t.paidMethod==='cash'?'Cash':(t.paidMethod==='gpay'?'GPay':'—')):'—';
    var cashAmt=paid&&t.paidMethod==='cash'?amount:0;
    var gpayAmt=paid&&t.paidMethod==='gpay'?amount:0;
    var when=paid&&t.paidAt?fmtWhen(t.paidAt):'Fri, 27 Nov 2026 · 10 AM';
    var qrText='https://spark.maraugusthinosecollege.org/ticket?id='+t.id;
    var banner=paid?'FEE RECEIPT + FEE RECEIPT + FEE RECEIPT + FEE RECEIPT + ':'SPARK TICKET + SPARK TICKET + SPARK TICKET + SPARK TICKET + ';
    var mq='<div class="rc-marquee"><span class="rc-mq-track"><span>'+banner+'</span><span>'+banner+'</span></span></div>';
    var rows='';
    rows+='<div class="rc-row"><span>School</span><b>'+esc(t.school)+'</b></div>';
    rows+='<div class="rc-row"><span>Members</span><b>'+memberList.map(function(m){return esc(m);}).join(', ')+'</b></div>';
    rows+='<div class="rc-row"><span>Team size</span><b>Team of '+esc(t.team)+'</b></div>';
    rows+='<div class="rc-row"><span>Phone</span><b>'+esc(t.phone)+'</b></div>';
    rows+='<div class="rc-row"><span>Method</span><b>'+esc(method)+'</b></div>';
    // Confirmation email note: register.html stashes the address here when
    // the confirmation is on its way. Shown once, then cleared.
    var emailed=null;
    try{emailed=sessionStorage.getItem('spark_emailed');sessionStorage.removeItem('spark_emailed');}catch(e){}
    state.style.display='none';
    slot.innerHTML='<div class="rc-card" id="reg-ticket">'
      +mq
      +'<div class="rc-body"><div class="rc-wm"><b>SPARK</b></div><div class="rc-inner">'
      +'<div class="rc-head"><div><div class="rc-kicker">SPARK 2K26 · '+(paid?'Official Receipt':'Official Ticket')+'</div>'
      +'<div class="rc-name">'+esc(t.event)+'</div>'
      +'<div class="rc-sub">Fri, 27 Nov 2026 · 10 AM · Mar Augusthinose College, Ramapuram</div></div>'
      +'<span class="rc-pill '+(paid?'paid':'unpaid')+'">'+(paid?'PAID IN FULL':'PAY AT VENUE')+'</span></div>'
      +'<div class="rc-amt-label">'+(paid?'You paid':'Fee due')+'</div>'
      +'<div class="rc-amt">'+esc(inr(amount))+'</div>'
      +'<div class="rc-who"><div><div class="rc-who-label">'+(t.teamName?'Team':'Leader')+'</div>'
      +'<div class="rc-who-name">'+esc(t.teamName||t.name)+'</div>'
      +'<div class="rc-who-date">'+esc(when)+'</div></div>'
      +'<span class="rc-chest-pill">CHEST '+esc(t.chest||'—')+'</span></div>'
      +'<div class="rc-details">'+rows+'</div>'
      +'</div></div>'
      +'<div class="rc-white">'
      +'<div class="rc-split"><div class="rc-cell"><div class="rc-cell-label">Cash</div><div class="rc-cell-val">'+esc(inr(cashAmt))+'</div></div>'
      +'<div class="rc-cell"><div class="rc-cell-label">GPay</div><div class="rc-cell-val">'+esc(inr(gpayAmt))+'</div></div></div>'
      +'<div class="rc-verify"><div class="rc-cell-label">Verify code</div><div class="rc-cell-val">'+esc(t.id)+'</div></div>'
      +'<div class="rc-qr-row"><div class="rc-qr">'+dotQRsvg(qrText,120)+'</div>'
      +'<div class="rc-qr-side"><div class="rc-cell-label">Scan to verify</div><div class="rc-cell-val">Show this at the desk with a valid school ID. Report by 9:30 AM.</div></div></div>'
      +'<div class="rc-barcode">'+barcodeSVG(t.id)+'</div>'
      +'<div class="rc-proof">KEEP THIS. IT’S YOUR PROOF.</div>'
      +'<div class="rc-issuer">issued by NEXUS · SPARK 2K26</div>'
      +'</div></div>'
      +'<div class="tk-actions"><button class="tk-dl" id="tk-dl" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/></svg><span class="tk-btn-label">Download ticket</span></button>'
      +'<button class="tk-share" id="tk-share" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><span class="tk-btn-label">Share ticket</span></button></div>'
      +'<p class="tk-dl-note">Keep this ticket safe. You will need it at the venue.'
      +(emailed?'<br>Confirmation email on its way to '+esc(emailed)+'.</p>':'</p>');
    document.title=t.event+' — Your Ticket | SPARK 2K26';
    var dl=document.getElementById('tk-dl');
    if(dl)dl.addEventListener('click',function(){downloadTicket(t);});
    var sh=document.getElementById('tk-share');
    if(sh)sh.addEventListener('click',function(){
      var shareData={title:'SPARK 2K26 Ticket — '+t.event,text:'My SPARK 2K26 ticket · Chest '+(t.chest||'')+' · Verify '+t.id,url:qrText};
      if(navigator.share){navigator.share(shareData).catch(function(){});}
      else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(qrText).then(function(){setBtnLabel(sh,'Link copied');setTimeout(function(){setBtnLabel(sh,'Share ticket');},2000);});}
      else{location.href=qrText;}
    });
    // Live update: while unpaid, re-check every 60s (only while the page is
    // visible). The moment the counter marks it paid, the ticket flips to
    // the receipt by itself. Polling stops once paid, or after 10 minutes
    // (a "Tap to refresh" button is shown instead), so an open tab cannot
    // hammer the shared per-IP ticket bucket. A 429 skips the next tick.
    liveNote.hidden=paid;
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    if(!paid){
      var pollStart=Date.now(), pollBackoff=false;
      pollTimer=setInterval(function(){
        if(document.hidden)return;
        if(pollBackoff){pollBackoff=false;return;}
        if(Date.now()-pollStart>=600000){clearInterval(pollTimer);pollTimer=null;showRefresh();return;}
        ticketFetch().then(function(r){
          if(r.status===429){pollBackoff=true;return null;}
          return r.json();
        }).then(function(d){
          if(d&&d.ok&&d.ticket&&d.ticket.paid){render(d.ticket);}
        }).catch(function(){});
      },60000);
    }
  }
  ticketFetch().then(function(r){
    if(r.status===429){
      state.innerHTML='<h1>Too many requests</h1><p>Too many people are loading tickets right now. Please wait a moment and try again.</p><p><button type="button" id="tk-retry">Try again</button></p>';
      var rb=document.getElementById('tk-retry');
      if(rb)rb.addEventListener('click',function(){location.reload();});
      return null;
    }
    return r.json();
  }).then(function(d){
    if(!d)return;
    if(!d.ok||!d.ticket){
      state.innerHTML='<h1>Ticket not found</h1><p>We could not find a registration with this ID. It may have been removed, or the link is wrong.</p>';
      return;
    }
    var t=d.ticket;
    // Save this registration on this device so "My Registrations" can show
    // it later without typing a phone number. Silent; never affects the ticket.
    try{
      var saved=JSON.parse(localStorage.getItem('spark_my_regs')||'[]');
      if(!Array.isArray(saved))saved=[];
      saved=[t.id].concat(saved.filter(function(x){return x!==t.id;})).slice(0,20);
      localStorage.setItem('spark_my_regs',JSON.stringify(saved));
      if(t.phone)localStorage.setItem('spark_my_phone',t.phone);
      // Refresh the top button badge right away (app.js already ran).
      var b=document.querySelector('.myregs-count');
      if(b){b.textContent=saved.length>99?'99+':String(saved.length);b.hidden=saved.length===0;}
    }catch(e){}
    render(t);
  }).catch(function(){
    state.innerHTML='<h1>Could not load ticket</h1><p>Please check your connection and try again.</p>';
  });
})();
</script>
</body>
</html>
