<script>
(function(){
  var app=document.getElementById('reg-app');
  var params=new URLSearchParams(location.search);
  var slug=(params.get('event')||'').toLowerCase().trim();
  // Also support /registration/<slug> if the server kept the path instead of the query.
  if(!slug){
    var parts=location.pathname.split('/').filter(Boolean);
    if(parts[0]==='registration'&&parts[1]) slug=parts[1].toLowerCase();
  }
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
  function teamLabel(e){var mn=Number(e.teamMin), mx=Number(e.teamMax);if(!Number.isInteger(mn)||!Number.isInteger(mx)||mn<1||mx<1||mn>20||mx>20||mn>mx)return 'Team event';return mn===mx?mn+' member'+(mn>1?'s':''):mn+'–'+mx+' members';}
  function svgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function posterDataURL(src){
    return fetch(src).then(function(r){return r.blob();}).then(function(b){
      return new Promise(function(res,rej){
        var fr=new FileReader();
        fr.onload=function(){res(fr.result);};
        fr.onerror=function(){rej(new Error('poster'));};
        fr.readAsDataURL(b);
      });
    });
  }
  // Spark dot QR: a real QR code (Registration ID) drawn as dots, with the
  // three finder squares kept solid so it still scans. Returns SVG shape
  // elements positioned at (x0,y0) with the given size, so the same code
  // feeds both the on-screen ticket and the downloaded ticket.
  function dotQRshapes(text,x0,y0,size){
    if(typeof qrcode==='undefined'||!text)return '';
    var qr=qrcode(0,'M');
    qr.addData(text);
    qr.make();
    var n=qr.getModuleCount(), q=4, total=n+2*q, cell=size/total, s='';
    function isFinder(r,c){return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);}
    for(var r=0;r<n;r++){
      for(var c=0;c<n;c++){
        if(!qr.isDark(r,c))continue;
        var x=x0+(c+q)*cell, y=y0+(r+q)*cell;
        if(isFinder(r,c)){
          s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cell.toFixed(1)+'" height="'+cell.toFixed(1)+'" fill="#1a0b2e"/>';
        }else{
          s+='<circle cx="'+(x+cell/2).toFixed(1)+'" cy="'+(y+cell/2).toFixed(1)+'" r="'+(cell*0.42).toFixed(1)+'" fill="#1a0b2e"/>';
        }
      }
    }
    return s;
  }
  function dotQRsvg(text,size){
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><rect width="'+size+'" height="'+size+'" rx="16" fill="#fff"/>'+dotQRshapes(text,0,0,size)+'</svg>';
  }
  function downloadTicket(e,regId,posterSrc,qrText){
    var btn=document.getElementById('tk-dl');
    if(btn){btn.disabled=true;btn.textContent='Preparing ticket…';}
    // Read the rendered ticket details back from the page so the download
    // always matches what the student sees.
    var tk=document.getElementById('reg-ticket');
    var rows=[];
    if(tk){
      var els=tk.querySelectorAll('.tk-row');
      els.forEach(function(r){
        var k=r.querySelector('.tk-k'), v=r.querySelector('.tk-v');
        if(k&&v)rows.push({k:k.textContent.trim(),v:v.textContent.trim().replace(/\s+/g,' ')});
      });
    }
    // Minimal ticket, no poster: compact SVG, height fits the content.
    var W=1080,px=72,rowH=58;
    var H=698+rows.length*rowH;
    var y=px, svg='';
    svg+='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    svg+='<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b3dff"/><stop offset=".45" stop-color="#8f47e6"/><stop offset="1" stop-color="#3d1596"/></linearGradient></defs>';
    svg+='<rect width="'+W+'" height="'+H+'" rx="48" fill="url(#bg)"/>';
    svg+='<text x="'+px+'" y="'+(y+26)+'" font-family="Arial,sans-serif" font-size="28" letter-spacing="5" fill="rgba(255,255,255,.75)">SPARK 2K26 · REGISTERED</text>';
    y+=64;
    svg+='<text x="'+px+'" y="'+(y+40)+'" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#fff">'+svgEsc(e.name)+'</text>';
    y+=88;
    svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,.85)">Fri, 27 Nov 2026 · 10 AM · Mar Augusthinose College, Ramapuram</text>';
    y+=44;
    svg+='<line x1="'+px+'" y1="'+y+'" x2="'+(W-px)+'" y2="'+y+'" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="10 8"/>';
    y+=28;
    // QR + Registration ID side by side
    var qrSize=210, qrX=px, qrY=y;
    if(regId){
      svg+='<rect x="'+qrX+'" y="'+qrY+'" width="'+qrSize+'" height="'+qrSize+'" rx="16" fill="#fff"/>';
      svg+=dotQRshapes(qrText||regId,qrX,qrY,qrSize);
      var tx=qrX+qrSize+36;
      svg+='<text x="'+tx+'" y="'+(qrY+52)+'" font-family="Arial,sans-serif" font-size="26" letter-spacing="3" fill="rgba(255,255,255,.75)">REGISTRATION ID</text>';
      svg+='<text x="'+tx+'" y="'+(qrY+102)+'" font-family="monospace" font-size="34" font-weight="700" letter-spacing="1" fill="#fff">'+svgEsc(regId)+'</text>';
      svg+='<text x="'+tx+'" y="'+(qrY+148)+'" font-family="Arial,sans-serif" font-size="26" fill="rgba(255,255,255,.85)">Scan at the desk</text>';
    }
    y+=qrSize+28;
    rows.forEach(function(r){
      svg+='<text x="'+px+'" y="'+(y+10)+'" font-family="Arial,sans-serif" font-size="30" fill="rgba(255,255,255,.75)">'+svgEsc(r.k)+'</text>';
      svg+='<text x="'+(W-px)+'" y="'+(y+10)+'" text-anchor="end" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">'+svgEsc(r.v)+'</text>';
      y+=rowH;
    });
    y+=16;
    svg+='<text x="'+(W/2)+'" y="'+(y+10)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="rgba(255,255,255,.85)">Show this ticket at the registration desk · Carry a valid school ID</text>';
    y+=44;
    svg+='<text x="'+(W/2)+'" y="'+(y+10)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="rgba(255,255,255,.85)">Report by 9:30 AM · 27 November 2026</text>';
    svg+='<text x="'+(W/2)+'" y="'+(H-36)+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" letter-spacing="4" fill="rgba(255,255,255,.6)">NEXUS · SPARK 2K26</text>';
    svg+='</svg>';
    // Render SVG to PNG for easy sharing, fall back to the SVG file.
    var img=new Image();
    var url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    img.onload=function(){
      try{
        var c=document.createElement('canvas');c.width=W;c.height=H;
        var cx=c.getContext('2d');cx.drawImage(img,0,0,W,H);
        c.toBlob(function(b){
          if(!b){saveSVG();return;}
          var a=document.createElement('a');
          a.href=URL.createObjectURL(b);
          a.download='SPARK-2K26-ticket-'+(regId||e.slug)+'.png';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
          if(btn){btn.disabled=false;btn.textContent='Download ticket';}
        },'image/png');
      }catch(err){saveSVG();}
    };
    img.onerror=function(){saveSVG();};
    function saveSVG(){
      var blob=new Blob([svg],{type:'image/svg+xml'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='SPARK-2K26-ticket-'+(regId||e.slug)+'.svg';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      if(btn){btn.disabled=false;btn.textContent='Download ticket';}
    }
    img.src=url;
  }
  function showMsg(title,body,back){
    app.innerHTML='<div style="padding:60px 0;text-align:center">'
      +'<h1 style="font-size:26px;margin-bottom:10px">'+esc(title)+'</h1>'
      +'<p style="color:#86868b;line-height:1.6;max-width:420px;margin:0 auto 22px">'+esc(body)+'</p>'
      +(back?'<a class="gz-btn" href="/events" style="display:inline-block">See all events</a>':'<button class="gz-btn" onclick="location.reload()">Try again</button>')
      +'</div>';
  }
  function acc(title,items,cls){
    // R3-m28: rules/how/reqs stored as a string (not an array) used to
    // throw in render() and leave the page stuck on "Loading event…".
    if(!Array.isArray(items)||!items.length)return '';
    return '<details class="rd-acc"><summary>'+esc(title)+'</summary><ul class="rd-list '+cls+'">'
      +items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></details>';
  }
  var FEST_CONTACT='Ananthu Anil 7510142466 \u00b7 Bista Mariya Jojo 9746446739';
  var LEAD_PHONE='7510142466';
  var WA_TEXT=encodeURIComponent('Hi, I have a question about SPARK fest');
  var PHONE_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
  var CHAT_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>';
  function render(e,totalEvents,coordNames){
    document.title='Register — '+e.name+' | SPARK 2K26';
    var fl=document.getElementById('f-line');
    if(fl&&totalEvents)fl.textContent=(totalEvents===1?'One event':({1:'One',2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight'}[totalEvents]||totalEvents)+' events')+'. One day. One campus.';
    var num=String(e.order||1).padStart(2,'0');
    // Smart form per event: every event has a FIXED team size (min==max),
    // so a dropdown is pointless. Solo events get no team fields at all;
    // team events get a static size line, a team name, and exactly the
    // right number of other-member slots.
    var fixedSize=(e.teamMin===e.teamMax)?e.teamMin:0;
    var isSolo=(e.teamMax===1);
    var opts='';
    for(var n=e.teamMin;n<=e.teamMax;n++)opts+='<option value="'+n+'">'+n+'</option>';
    // Team size row: fixed size = static line + hidden input; range = dropdown.
    var teamSizeRow='';
    if(fixedSize===1){
      teamSizeRow='<input type="hidden" id="in-team" value="1">';
    }else if(fixedSize>1){
      teamSizeRow='<div class="field" id="f-team"><label>Team size</label><span class="rg-static">'+fixedSize+' members</span></div><input type="hidden" id="in-team" value="'+fixedSize+'">';
    }else{
      teamSizeRow='<div class="field" id="f-team"><label for="in-team">Team size</label><select id="in-team">'+opts+'</select><div class="err">Choose your team size.</div></div>';
    }
    // Team name: only for team events. It is REQUIRED (owner's call).
    var teamNameRow=isSolo?'':'<div class="field" id="f-teamname"><label for="in-teamname">Team name</label><input id="in-teamname" type="text" placeholder="Your team name" maxlength="80"><div class="err">Enter your team name.</div></div>';
    // Other members: only for team events. One block per member, Name
    // only (owner's call, 23 Nov: no phone or email for members). The
    // leader is Member 1; these blocks are Member 2, 3, 4.
    var membersRow='';
    if(!isSolo){
      var others=e.teamMax-1;
      for(var mi=0;mi<others;mi++){
        var mn=mi+2;
        membersRow+='<div class="mem" id="mem-block-'+mi+'"><div class="mem-head">Member '+mn+'</div>'
          +'<div class="field" id="f-mem'+mi+'-name"><label for="in-mem'+mi+'-name">Name</label><input id="in-mem'+mi+'-name" type="text" placeholder="Full name" maxlength="100"><div class="err">Enter member '+mn+'\'s name.</div></div>'
          +'</div>';
      }
    }
    // Prompting slot limit (27 Nov 2026): when slotsLeft is 0 the
    // event is full — treat it as closed. The student sees a clear
    // "Registration closed" notice, not just a disabled button, and
    // no submittable form is rendered behind it.
    var slotsFull=(typeof e.slotsLeft==='number'&&e.slotsLeft<=0);
    var closed=!e.regOpen||slotsFull;
    var teamMeta=(e.teamMin===1?'Solo or up to '+e.teamMax:'Teams of '+e.teamMin+'\u2013'+e.teamMax);
    app.innerHTML=
      '<div class="rg-bar"><a class="glass-back" href="/events" aria-label="Back to events"><svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true"><path d="M9.5 1.5 2 9l7.5 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Events</span></a></div>'
      +'<div class="tk-wrap"><div class="tk">'
      +'<img class="tk-poster" src="'+(e.poster?'/api/poster?event='+esc(e.slug):'/assets/poster-'+esc(e.slug)+'.webp')+'" width="1024" height="1536" alt="'+esc(e.name)+' \u2014 SPARK 2K26 event poster" decoding="async">'
      +'<i class="tk-perf" aria-hidden="true"></i>'
      +'<span class="tk-pill"><i></i>Inter-School Competition</span>'
      +'<p class="tk-date">Nov 27</p>'
      +'<p class="tk-meta">Fri \u00b7 10 AM \u00b7 '+teamMeta+'</p>'
      +'<a class="tk-go" href="#reg-form-dyn">Register now \u2193</a>'
      +'</div></div>'
      +'<header class="rg-head"><span class="rg-chip">'+num+' · Inter-School</span><h1>'+esc(e.name)+'</h1><p class="rg-tag">'+esc(e.tagline||'')+'</p>'
      +'<div class="rg-prizes"><span>1st '+fmt(e.prize1)+'</span>'+(e.prize2?'<span>2nd '+fmt(e.prize2)+'</span>':'<span>Winner takes all</span>')+'</div></header>'
      +(closed
        ?'<div class="ok-msg show" role="status"><h3>Registrations closed</h3><p>'+(slotsFull
          ?'All slots for <strong>'+esc(e.name)+'</strong> are full. Check the Events page for the other events.'
          :'Registrations for <strong>'+esc(e.name)+'</strong> are closed. Check the Events page for the other events.')+'</p></div>'
        :'<form id="reg-form-dyn" class="rg-form" data-event="'+esc(e.name)+'" data-slug="'+esc(e.slug)+'" data-min="'+e.teamMin+'" data-max="'+e.teamMax+'" novalidate>'
        // Prompting slot limit: show the slots left clearly at the
        // top of the form while any remain. Only events with a
        // maxSlots carry slotsLeft, so this shows on Prompting only.
        +(typeof e.slotsLeft==='number'&&e.slotsLeft>0?'<p class="reg-slots">'+e.slotsLeft+' slots left</p>':'')
        +'<div class="rg-group">'
        +'<div class="field" id="f-name"><label for="in-name">Name</label><input id="in-name" type="text" autocomplete="name" placeholder="Team leader" maxlength="100"><div class="err">Enter your full name.</div></div>'
        +'<div class="field" id="f-school"><label for="in-school">School</label><input id="in-school" type="text" autocomplete="organization" placeholder="Your school" maxlength="150"><div class="err">Enter your school name.</div></div>'
        +'<div class="field" id="f-phone"><label for="in-phone">Phone</label><input id="in-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="10-digit mobile"><div class="err">Enter a valid 10-digit mobile number.</div></div>'
        +'<div class="field" id="f-email"><label for="in-email">Email</label><input id="in-email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254"><div class="err">Enter a valid email address.</div></div>'
        +'<div class="field hp" aria-hidden="true"><label for="in-website">Website</label><input id="in-website" type="text" autocomplete="off" tabindex="-1"></div>'
        +'</div><div class="rg-group">'
        +teamSizeRow
        +teamNameRow
        +membersRow
        +'</div><div class="rg-group">'
        +'<div class="field check" id="f-agree"><label for="in-agree">I confirm these details are correct, every member will carry a valid school ID card on 27 November 2026, and I agree to the <a href="/terms">Terms &amp; Conditions</a> and to my details being used only for SPARK fest registration.</label><input id="in-agree" type="checkbox"></div>'
        +'<p class="reg-note">Privacy: your name, school, phone and email are used only to run SPARK fest and contact you about it. They are not shared or sold. Ask the organizers any time to delete them. Read the full <a href="/privacy">Privacy Policy</a>.</p>'
        +'</div>'
        +'<button class="rg-submit" type="submit">Register for '+esc(e.name)+'</button>'
        +(e.fee?'<p class="reg-note">Registration is free online. Fee: '+esc(e.fee)+', pay at the venue on 27 November 2026. Report by 9:30 AM with a valid school ID.</p>':'<p class="reg-note">Your registration is saved with the organizers.</p>')
        +'<div class="ok-msg" id="ok-msg" role="status"></div>'
        +'</form>')
      +'<div class="rd-below"><h3 class="rd-about-h">About this event</h3><p class="rd-about">'+esc(e.about||'')+'</p>'
      +'<div class="ww-card">'
      +'<div class="ww-row"><span class="ww-k">When</span><span>'+esc(e.when||'')+'</span></div>'
      +'<div class="ww-row"><span class="ww-k">Where</span><span>'+esc(e.where||'')+'</span></div>'
      +'<div class="ww-row"><span class="ww-k">Team</span><span>'+esc(teamLabel(e))+'</span></div>'
      +'<div class="ww-row"><span class="ww-k">Duration</span><span>'+esc(e.duration||'')+'</span></div>'
      +(e.fee?'<div class="ww-row"><span class="ww-k">Fee</span><span>'+esc(e.fee)+'</span></div>':'')
      +'<div class="ww-row"><span class="ww-k">Coordinators</span><span>'+esc(coordNames||'\u2014')+'</span></div>'
      +'<div class="ww-row"><span class="ww-k">Contact</span><span>'+esc(FEST_CONTACT)+'</span></div>'
      +'<div class="ww-actions"><a class="ww-act call" href="tel:+91'+LEAD_PHONE+'">'+PHONE_SVG+'Call</a><a class="ww-act wa" href="https://wa.me/91'+LEAD_PHONE+'?text='+WA_TEXT+'" target="_blank" rel="noopener">'+CHAT_SVG+'WhatsApp Msg</a></div>'
      +'</div>'
      +acc('How it works',e.how,'num')
      +acc('Rules',e.rules,'dot')
      +acc('Requirements',e.reqs,'dot')
      +'</div>';
    if(!closed)bindForm(e);
  }
  function bindForm(e){
    var form=document.getElementById('reg-form-dyn');
    // Bot check: when the form opened. A submit under 2s is flagged server-side.
    var startedAt=Date.now();
    var teamSel=document.getElementById('in-team');
    // Only a range event has a real team-size dropdown to sync. Fixed-size
    // events render the member blocks already correct (or not at all).
    var isSelect=teamSel&&teamSel.tagName==='SELECT';
    function syncMembers(){
      if(!isSelect)return;
      var n=parseInt(teamSel.value,10)||1;
      for(var i=0;i<e.teamMax-1;i++){
        var b=document.getElementById('mem-block-'+i);
        if(b)b.hidden=i>=n-1;
      }
    }
    if(isSelect){teamSel.addEventListener('change',syncMembers);syncMembers();}
    // Team name uniqueness (owner's call): only the TEAM name is checked,
    // never student names. Live check as the user types (debounced) and
    // on blur; the red message below the field is the theme's .err.
    var teamNameTaken=false, teamNameTimer=null;
    var teamNameEl=document.getElementById('in-teamname');
    function teamNameErr(txt){
      var f=document.getElementById('f-teamname');
      var er=f&&f.querySelector('.err');
      if(er)er.textContent=txt;
    }
    async function checkTeamName(){
      if(!teamNameEl)return false;
      var v=teamNameEl.value.trim();
      if(v.length<2){teamNameTaken=false;teamNameErr('Enter your team name.');return false;}
      try{
        // 8s timeout (V3-m15): a hung availability check must not stall
        // the submit; a failed check is treated as "not taken" (the
        // server re-checks on submit anyway).
        var ctl=('AbortController' in window)?new AbortController():null;
        var to=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},8000):null;
        var r=await fetch('/api/register?event='+encodeURIComponent(e.slug)+'&teamName='+encodeURIComponent(v),{signal:ctl?ctl.signal:undefined});
        if(to)clearTimeout(to);
        var d=await r.json();
        teamNameTaken=!!(d&&d.taken);
      }catch(err){teamNameTaken=false;}
      if(teamNameTaken)teamNameErr('This team name is already taken, try another');
      else teamNameErr('Enter your team name.');
      var f=document.getElementById('f-teamname');
      if(f)f.classList.toggle('invalid',teamNameTaken);
      return teamNameTaken;
    }
    if(teamNameEl){
      teamNameEl.addEventListener('input',function(){
        clearTimeout(teamNameTimer);
        teamNameTimer=setTimeout(checkTeamName,400);
      });
      teamNameEl.addEventListener('blur',checkTeamName);
    }
    form.addEventListener('input',function(ev){
      var f=ev.target.closest&&ev.target.closest('.field');
      if(f)f.classList.remove('invalid');
    });
    var submitting=false;
    form.addEventListener('submit',async function(ev){
      ev.preventDefault();
      // Double-submit guard, set synchronously at submit start (V3-m14):
      // the old guard (btn.disabled) ran only after await checkTeamName,
      // so a fast double-tap could fire two registrations.
      if(submitting)return;
      submitting=true;
      var ok=true, first=null;
      function mark(id,good){
        var f=document.getElementById('f-'+id);
        if(f)f.classList.toggle('invalid',!good);
        if(!good){ok=false;if(!first)first=f;}
      }
      function val(id){var el=document.getElementById('in-'+id);return el?el.value.trim():'';}
      var name=val('name'), school=val('school'), phone=val('phone').replace(/\D/g,''), email=val('email'),
          team=parseInt(val('team'),10), teamname=val('teamname');
      // R3-m26: a 00-prefixed number ("0091 98765…") normalises to the
      // 10-digit mobile too, matching the server (normPhone).
      if(phone.slice(0,2)==='00')phone=phone.slice(2);
      if(phone.length===12&&phone.slice(0,2)==='91')phone=phone.slice(2);
      else if(phone.length===11&&phone.charAt(0)==='0')phone=phone.slice(1);
      // Members, one by one: Name only (no phone or email for members).
      var list=[];
      if(team>1){
        var need=team-1;
        for(var mi=0;mi<need;mi++){
          list.push(val('mem'+mi+'-name'));
        }
      }
      mark('name',name.length>=2);
      mark('school',school.length>=2);
      mark('phone',/^[6-9]\d{9}$/.test(phone));
      mark('email',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
      mark('team',team>=e.teamMin&&team<=e.teamMax);
      var agree=document.getElementById('in-agree');
      if(agree)mark('agree',agree.checked);
      // R3-m23: the live team-name check can take up to 8 s — show
      // feedback while it runs instead of a dead-looking form. The
      // button is disabled from here so a double-tap cannot fire two
      // submits while the check is in flight.
      var btn=form.querySelector('.rg-submit');
      if(team>1){
        if(btn){btn.disabled=true;btn.textContent='Checking team name…';}
        await checkTeamName();
        if(teamNameTaken)teamNameErr('This team name is already taken, try another');
        else teamNameErr('Enter your team name.');
        mark('teamname',teamname.length>=2&&!teamNameTaken);
        list.forEach(function(m,i){
          mark('mem'+i+'-name',(m||'').length>=2);
        });
      }
      if(!ok){submitting=false;if(btn){btn.disabled=false;btn.textContent='Register for '+e.name;}if(first&&first.scrollIntoView)first.scrollIntoView({behavior:'smooth',block:'center'});return;}
      btn.disabled=true;btn.textContent='Registering…';
      var payload={event:e.slug,name:name,school:school,phone:phone,email:email,team:team,teamName:teamname,members:list,website:val('website'),startedAt:startedAt};
      // R3-m33: 9 s timeout — the Vercel function cap is 10 s, so the
      // old 15 s timeout could never fire for server slowness and the
      // student stared at "Registering…" up to 5 s after the function
      // died. 9 s fails visibly inside the cap (error copy unchanged).
      var ctl=('AbortController' in window)?new AbortController():null;
      var pto=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},9000):null;
      try{
        var r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined});
        var d=await r.json().catch(function(){return {};});
        if(!r.ok){var ex=new Error(d.error||'Registration failed');ex.status=r.status;throw ex;}
        // Registration saved: the ticket lives on its own page.
        // If a confirmation email is on its way, the ticket page shows the
        // line (this page redirects away too fast to show it here).
        if(d.emailSent){try{sessionStorage.setItem('spark_emailed',email);}catch(e){}}
        var regId=d.id||'';
        if(regId){location.href='/ticket?id='+encodeURIComponent(regId);return;}
        var box=document.getElementById('ok-msg');
        if(box){
          box.innerHTML='<h3>Registered</h3><p>Your registration is saved. Your ticket link will be shared with you.</p>'
            +(d.emailSent?'<p>Confirmation email on its way to '+esc(email)+'.</p>':'');
          box.classList.add('show');
          box.scrollIntoView({behavior:'smooth',block:'center'});
        }
        form.reset();syncMembers();
      }catch(err){
        // Recovery guidance: the server saves the registration (HSET/ZADD)
        // BEFORE it sends the email and the response, so a timeout or a
        // dropped connection after submit can mean the registration IS
        // saved even though no response arrived. Never tell the student
        // to just "try again" — that produces a confusing 409.
        var isTimeout=err&&err.name==='AbortError';
        var isNetErr=err&&err.name==='TypeError';
        var is409=err&&err.status===409;
        var head='Could not register';
        var msgHtml;
        if(is409){
          head='Already registered';
          msgHtml='This phone/email is already registered for this event. If this was you, open <a href="/my-registrations.html">My Registrations</a> or your ticket link \u2014 do not submit again. If this was not you, ask the desk for help.';
        }else if(isTimeout||isNetErr){
          // Keep the existing timeout text as the first line, then add
          // the recovery guidance.
          msgHtml=(isTimeout?'The request timed out. Please check your connection and try again.':'The connection was lost while submitting.')
            +' Your registration may already be saved. Do not submit again \u2014 check <a href="/my-registrations.html">My Registrations</a> or ask the desk to look you up by phone.';
        }else{
          msgHtml=esc(err.message||'Something went wrong. Please try again.');
        }
        var box2=document.getElementById('ok-msg');
        if(box2){
          box2.innerHTML='<h3>'+head+'</h3><p>'+msgHtml+'</p>';
          box2.classList.add('show');
          box2.scrollIntoView({behavior:'smooth',block:'center'});
        }
      }finally{
        if(pto)clearTimeout(pto);
        submitting=false;
        btn.disabled=false;btn.textContent='Register for '+e.name;
      }
    });
  }
  if(!slug){showMsg('No event selected','Pick an event from the Events page to register.',true);return;}
  // 8s timeout per fetch: a hung request resolves null instead of
  // leaving the page on "Loading event..." forever. null is distinct
  // from an empty list (#33): a failed load must say "Could not load",
  // never "Event not available".
  function fetchJson(url){
    return new Promise(function(resolve){
      var done=false;
      var to=setTimeout(function(){ if(!done){ done=true; resolve(null); } }, 8000);
      fetch(url).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(d){ if(!done){ done=true; clearTimeout(to); resolve(d); } }).catch(function(){ if(!done){ done=true; clearTimeout(to); resolve(null); } });
    });
  }
  // R3-m22: the events fetch is load-bearing, the coordinators fetch is
  // decorative — do NOT Promise.all them. Render the form as soon as the
  // events arrive (up to 8 s sooner on slow venue Wi-Fi), then fill in
  // the coordinator names when they land by patching the row in place.
  function updateCoordNames(names){
    var rows=document.querySelectorAll('.ww-row');
    for(var i=0;i<rows.length;i++){
      var k=rows[i].querySelector('.ww-k');
      if(k&&k.textContent.trim()==='Coordinators'){
        var v=rows[i].querySelector('span:not(.ww-k)');
        if(v)v.textContent=names||'—';
        return;
      }
    }
  }
  fetchJson('/api/events').then(function(d){
    // The events list is load-bearing: without it the page cannot tell a
    // missing event from a dead connection, so null means "try again".
    if(!d||!Array.isArray(d.events)){showMsg('Could not load this event','Check your connection and try again.',false);return;}
    var list=d.events;
    var e=list.find(function(x){return x.slug===slug;});
    if(!e){showMsg('Event not available','This event does not exist or is no longer listed. See the events that are open.',true);return;}
    if(!e.visible){showMsg('Event not available','This event is no longer listed. See the events that are open.',true);return;}
    // A malformed stored event (bad team limits) must not render a broken
    // form (#34): refuse it plainly instead of "undefined member".
    var mn=Number(e.teamMin), mx=Number(e.teamMax);
    if(!Number.isInteger(mn)||!Number.isInteger(mx)||mn<1||mx<1||mn>20||mx>20||mn>mx){showMsg('Event not available','This event is not set up correctly. Ask the desk for help.',true);return;}
    render(e,list.filter(function(x){return x.visible;}).length,'');
    // Coordinators are decorative: a failed coordinators load just means
    // no coordinator names show (they fall back to '').
    fetchJson('/api/coordinators').then(function(c){
      var names=((c&&c.coordinators)||[]).filter(function(x){return x.team==='Student Coordinators'&&x.event===e.name;}).map(function(x){return x.name;});
      updateCoordNames(names.join(', '));
    });
  }).catch(function(){
    showMsg('Could not load this event','Check your connection and try again.',false);
  });
})();
</script>
<script src="/livebg.js?v=4" defer></script>
<script src="/assets/spark-bot.js?v=27"></script>
